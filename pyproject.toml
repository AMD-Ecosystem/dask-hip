[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=64.0.0",
    "wheel"
]

[project]
name = "amd-dask-hip"
dynamic = ["version"]
description = "Utilities for Dask and HIP interactions"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = { text = "Apache-2.0 AND MIT" }
requires-python = ">=3.10"
dependencies = [
    "dask==2025.9.1",
    "distributed==2025.9.1",

    "hip-python==7.2.*",
    "hip-python-as-cuda==7.2.*",
    "numba-hip==0.1.6",
    "amdsmi==26.2.*",

    "click >=8.1",
    "numpy>=1.23,<3.0a0",
    "pandas>=1.3",
    "rapids-dask-dependency==25.12.*,>=0.0.0a0",
# >>>>>>> END NEW CODE (f09c9b0)
    "zict>=2.0.0",
    "rich"
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
dask-cuda-worker = "dask_cuda.cli:worker"
dask-cuda-config = "dask_cuda.cli:config"

[project.entry-points.dask_cli]
cuda = "dask_cuda.cli:cuda"

[project.optional-dependencies]
docs = [
    "rocm-docs-core==1.27.0",
    "myst-parser",
    "sphinx-autoapi",
    "sphinx-copybutton",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-rerunfailures!=16.0.0",
    "pytest-timeout",
    "psutil",
    "pyarrow",
]
test_ucxx = [
    "amd-hipucxx==0.1.*",
    "amd-distributed-hipucxx==0.1.*",
]
test_hipdf = [
    "amd-dask-hipdf==3.0.*"
]

[project.urls]
Homepage = "https://github.com/rapidsai/dask-cuda"
Documentation = "https://docs.rapids.ai/api/dask-cuda/stable/"
Source = "https://github.com/rapidsai/dask-cuda"

[tool.coverage.run]
disable_warnings = [
    "include-ignored",
]
include = [
    "dask_cuda/*",
]
omit = [
    "dask_cuda/tests/*",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "docs",
    "__init__.py",
]

[tool.ruff.lint]
ignore = [
    # Assigning lambda expression
    "E731",
    # Ambiguous variable names
    "E741",
    # whitespace before :
    "E203",
    # whitespace after ,
    "E231",
]

[tool.ruff.lint.isort]
combine-as-imports = true
order-by-type = true
known-first-party = [
    "dask_cuda",
]
default-section = "third-party"
section-order = [
    "future",
    "standard-library",
    "third-party",
    "dask",
    "rapids",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"dask" = [
    "dask",
    "distributed",
]
"rapids" = [
    "rmm",
    "cuml",
    "cugraph",
    "dask_cudf",
    "cudf",
    "ucp",
]

[tool.pytest.ini_options]
filterwarnings = [
    "error::DeprecationWarning",
    "error::FutureWarning",
    # remove after https://github.com/rapidsai/dask-cuda/issues/1087 is closed
    "ignore:There is no current event loop:DeprecationWarning:tornado",
]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE.txt"]

[tool.setuptools.dynamic]
version = {file = "dask_cuda/VERSION"}

[tool.setuptools.packages.find]
include = [
    "dask_cuda",
    "dask_cuda.*",
    "pynvml2amdsmi",
    "pynvml",
]
exclude = [
# <<<<<<< OLD CODE from 1bfe692 (9962599) - COMMENTED OUT
#     "dask_cuda.benchmarks*",
#     "dask_cuda.tests*",
# =======
    "docs",
    "tests",
    "docs.*",
    "examples.*",
    "tests.*",
# >>>>>>> END NEW CODE (9962599)
]

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI limit is 100 MiB, fail CI before we get too close to that
max_allowed_size_compressed = '75M'
