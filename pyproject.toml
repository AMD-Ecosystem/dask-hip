[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0.0",
]

[project]
name = "amd-dask-hip"
dynamic = ["version"]
description = "Utilities for Dask and HIP interactions"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = { text = "Apache-2.0 AND MIT" }
license-files = ["LICENSE", "NOTICE.txt"]
requires-python = ">=3.11"
dependencies = [
    "click >=8.1",
    "numpy>=1.23,<3.0",
    "pandas>=1.3",
    "zict>=2.0.0",

    "dask>=2026.1.1,<2026.1.2",
    "distributed>=2026.1.1,<2026.1.2",

    "hip-python==7.13.*",
    "hip-python-interop==7.13.*",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
dask-cuda-worker = "dask_cuda.cli:worker"
dask-cuda-config = "dask_cuda.cli:config"

[project.entry-points.dask_cli]
cuda = "dask_cuda.cli:cuda"

[project.optional-dependencies]
docs = [
    "rocm-docs-core==1.27.0",
    "myst-parser",
    "sphinx-autoapi",
    "sphinx-copybutton",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-rerunfailures!=16.0.0",
    "pytest-timeout",
    "psutil",
    "pyarrow",
]
test_ucxx = [
    "amd-hipucxx==0.2.*",
    "amd-distributed-hipucxx==0.2.*",
]
test_hipdf = [
    "amd-dask-hipdf==4.0.*"
]

[project.urls]
Homepage = "https://github.com/ROCm-DS/dask-hip"
Documentation = "https://rocm.docs.amd.com/projects/dask-hip/en/latest/"
Source = "https://github.com/ROCm-DS/dask-hip"

[tool.coverage.run]
disable_warnings = [
    "include-ignored",
]
include = [
    "dask_cuda/*",
]
omit = [
    "dask_cuda/tests/*",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "docs",
    "__init__.py",
]

[tool.ruff.lint]
ignore = [
    # Assigning lambda expression
    "E731",
    # Ambiguous variable names
    "E741",
    # whitespace before :
    "E203",
    # whitespace after ,
    "E231",
]

[tool.ruff.lint.isort]
combine-as-imports = true
order-by-type = true
known-first-party = [
    "dask_cuda",
]
default-section = "third-party"
section-order = [
    "future",
    "standard-library",
    "third-party",
    "dask",
    "rapids",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"dask" = [
    "dask",
    "distributed",
]
"rapids" = [
    "rmm",
    "cuml",
    "cugraph",
    "dask_cudf",
    "cudf",
    "ucp",
]

[tool.pytest.ini_options]
addopts = "--tb=native"
filterwarnings = [
    "error::DeprecationWarning",
    "error::FutureWarning",
    # remove after https://github.com/rapidsai/dask-cuda/issues/1087 is closed
    "ignore:There is no current event loop:DeprecationWarning:tornado",
]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE.txt"]

[tool.setuptools.dynamic]
version = {file = "dask_cuda/VERSION"}

[tool.setuptools.packages.find]
include = [
    "dask_cuda",
    "dask_cuda.*",
]
exclude = [
    "dask_cuda.benchmarks*",
    "dask_cuda.tests*",
]

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI hard limit is 1GiB, but try to keep these as small as possible
max_allowed_size_compressed = '10Mi'
