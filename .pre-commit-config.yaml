  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude: |
          (?x)^(
            .*test.*|
            ^CHANGELOG.md$|
          )
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.18.2'
    hooks:
      - id: mypy
        additional_dependencies: [types-cachetools]
        args: ["--module=dask_cuda", "--ignore-missing-imports"]
        pass_filenames: false
  - repo: https://github.com/rapidsai/pre-commit-hooks
    rev: v1.4.3
    hooks:
      - id: verify-alpha-spec
        args:
          - --fix
          - --mode
          - release
      - id: verify-copyright
        args: [--fix, --spdx]
        files: |
          (?x)
            [.](cmake|cpp|cu|cuh|h|hpp|sh|pxd|py|pyx|rs|java)$|
            CMakeLists[.]txt$|
            CMakeLists_standalone[.]txt$|
            meta[.]yaml$|
            pyproject[.]toml$|
            setup[.]cfg$|
            recipe[.]yaml$|
            ^[.]pre-commit-config[.]yaml$|
            dependencies[.]yaml$|
            pytest[.]ini$|
            Makefile$|
            [.]flake8$
      - id: verify-pyproject-license
      - id: verify-hardcoded-version
      - id: verify-hardcoded-version
        name: verify-hardcoded-version-ucxx
        args: [--fix, --version-file=UCXX_VERSION]
        exclude: |
          (?x)
            (^|/)devcontainer[.]json$|
            (^|/)dependencies[.]yaml$|
            ^[.]github/(workflows|ISSUE_TEMPLATE)/|
            (^|/)pom[.]xml$|
            ^[.]pre-commit-config[.]yaml$|
            ^conda/environments/|
            (^|/)VERSION$|
            (^|/)RAPIDS_BRANCH$|
            [.](md|rst|avro|parquet|png|orc|gz|pkl|sas7bdat)$
  - repo: https://github.com/rapidsai/dependency-file-generator
    rev: v1.20.0
    hooks:
      - id: rapids-dependency-file-generator
        args: ["--clean", "--warn-all", "--strict"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.24.1
    hooks:
      - id: zizmor
# >>>>>>> END NEW CODE (2a1fbe8)
